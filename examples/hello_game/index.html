<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>샘플: 신호 연타</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1626; color: #e8f3ff; font: 16px system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; }
    button { font: inherit; padding: 14px 28px; border-radius: 8px; border: 0; background: #5be3c4; color: #04231c; cursor: pointer; }
    p { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <p id="status">로딩 중...</p>
    <button id="tap" type="button" disabled>신호 보내기 (Space)</button>
    <p id="count">0</p>
  </main>
  <!-- 상대 경로: games/<id>/ 와 examples/<id>/ 어디서든 ../../sdk 로 접근됩니다. -->
  <script src="../../sdk/scorex-sdk.js"></script>
  <script>
    const DURATION_MS = 10000;
    let taps = 0;
    let startedAt = 0;
    let timer = null;
    let running = false;
    let paused = false;
    let pausedAt = 0;
    let pausedTotal = 0;
    let difficulty = 'NORMAL';
    const tap = document.querySelector('#tap');
    const statusEl = document.querySelector('#status');
    const countEl = document.querySelector('#count');

    function elapsed() { return (paused ? pausedAt : Date.now()) - startedAt - pausedTotal; }

    function stop() {
      running = false;
      clearInterval(timer);
      timer = null;
      tap.disabled = true;
    }

    function finish() {
      const durationMs = Math.min(DURATION_MS, elapsed());
      stop();
      statusEl.textContent = '종료!';
      // 점수 상한(manifest.maxScore)을 넘지 않게 제한합니다.
      Scorex.gameOver({ score: Math.min(1000, taps * 10), durationMs, result: 'clear', meta: { taps: taps } });
    }

    function tick() {
      if (paused) return;
      const left = Math.max(0, (DURATION_MS - elapsed()) / 1000);
      statusEl.textContent = '남은 시간 ' + left.toFixed(1) + '초';
      Scorex.hud({ time: Math.ceil(left), score: taps * 10, danger: left <= 3 });
      if (left <= 0) finish();
    }

    function onTap() {
      if (!running || paused) return;
      taps += 1;
      countEl.textContent = String(taps);
    }

    tap.addEventListener('click', onTap);
    window.addEventListener('keydown', (event) => { if (event.code === 'Space') { event.preventDefault(); onTap(); } });

    Scorex.onInit((init) => {
      difficulty = init.difficulty;
      taps = 0;
      countEl.textContent = '0';
      statusEl.textContent = '준비 (' + difficulty + ')';
    });
    Scorex.onStart(() => {
      taps = 0;
      startedAt = Date.now();
      pausedTotal = 0;
      paused = false;
      running = true;
      tap.disabled = false;
      tap.focus();
      Scorex.started();
      timer = setInterval(tick, 100);
    });
    Scorex.onPause(() => { if (!running) return; paused = true; pausedAt = Date.now(); statusEl.textContent = '일시정지'; });
    Scorex.onResume(() => { if (!running) return; pausedTotal += Date.now() - pausedAt; paused = false; });
    Scorex.onDestroy(stop);

    Scorex.connect({ gameId: 'hello_game', gameVersion: '1.0.0' });
  </script>
</body>
</html>
