<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1단 부스터 회수</title>
  <style>
    html, body { margin: 0; height: 100%; background: #071525; overflow: hidden; }
    body { display: grid; place-items: center; }
    #stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 3 / 2; }
    .controls { display: none; position: absolute; left: 0; right: 0; bottom: 8px; justify-content: space-between; padding: 0 12px; pointer-events: none; }
    .controls button { pointer-events: auto; width: 56px; height: 56px; border: 1px solid #3b8aa0; border-radius: 50%; background: #0d2a3dcc; color: #bff1ff; font-size: 22px; touch-action: none; user-select: none; -webkit-user-select: none; }
    .controls button.is-held { background: #2c8aa1; }
    .controls .pair { display: flex; gap: 8px; }
    @media (pointer: coarse) { .controls { display: flex; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" width="720" height="480" aria-label="1단 부스터 해상 회수 착륙 시뮬레이션"></canvas>
    <div class="controls" aria-label="부스터 착륙 조작 버튼">
      <div class="pair"><button type="button" data-control="left" aria-label="왼쪽 회전">↶</button><button type="button" data-control="right" aria-label="오른쪽 회전">↷</button></div>
      <button type="button" data-control="thrust" aria-label="추력 켜기">▲</button>
    </div>
  </div>
  <script src="matter.min.js"></script>
  <script src="../../sdk/scorex-sdk.js"></script>
  <script>
    const canvas = document.querySelector('#canvas');
    const context = canvas.getContext('2d');
    const engine = Matter.Engine.create({ enableSleeping: false });
    engine.gravity.x = 0;
    engine.gravity.y = 1;
    engine.gravity.scale = 0.00009;
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    let PAD_X = 470;
    const PAD_WIDTH = 140;
    const GROUND_Y = 424;
    const input = { rotate: 0, thrust: false };
    let rng = Math.random;
    let stars = [];
    let body = null;
    let pad = null;
    let obstacles = [];
    let floaters = [];
    let startX = 270;
    let fuel = 100;
    let running = false;
    let frame = null;
    let hudAt = 0;
    let activeMs = 0;
    let lastAt = 0;
    let physicsAccumulator = 0;
    const PHYSICS_STEP_MS = 1000 / 60;

    function seeded(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function between(min, max) { return min + rng() * (max - min); }

    function layoutLevel() {
      const half = PAD_WIDTH / 2;
      do {
        PAD_X = between(half + 40, WIDTH - half - 40);
        startX = between(60, WIDTH - 60);
      } while (Math.abs(PAD_X - startX) < 200);
      const placed = [];
      const count = 3 + Math.floor(rng() * 2);
      for (let attempt = 0; attempt < 80 && placed.length < count; attempt += 1) {
        const w = between(60, 120);
        const h = between(16, 26);
        const x = between(w / 2 + 20, WIDTH - w / 2 - 20);
        const y = between(170, 330);
        const nearPad = Math.abs(x - PAD_X) < half + w / 2 + 55;
        const nearStart = Math.abs(x - startX) < w / 2 + 75 && y < 230;
        const crowded = placed.some((o) => Math.abs(o.x - x) < (o.w + w) / 2 + 45 && Math.abs(o.y - y) < 70);
        if (nearPad || nearStart || crowded) continue;
        placed.push({ x, y, w, h });
      }
      return placed;
    }

    function setupWorld() {
      Matter.Composite.clear(engine.world, false, true);
      const half = PAD_WIDTH / 2;
      const layout = layoutLevel();
      pad = Matter.Bodies.rectangle(PAD_X, GROUND_Y - 10, PAD_WIDTH, 12, { isStatic: true, friction: .9, label: 'landing-pad' });
      floaters = layout.map(({ x, y, w, h }) => Matter.Bodies.rectangle(x, y, w, h, { isStatic: true, label: 'floating-obstacle' }));
      const leftWidth = PAD_X - half;
      const rightWidth = WIDTH - PAD_X - half;
      obstacles = [
        Matter.Bodies.rectangle(leftWidth / 2, 452, leftWidth, 56, { isStatic: true, label: 'terrain' }),
        Matter.Bodies.rectangle(PAD_X + half + rightWidth / 2, 452, rightWidth, 56, { isStatic: true, label: 'terrain' }),
        Matter.Bodies.rectangle(-14, 220, 28, 440, { isStatic: true, label: 'boundary' }),
        Matter.Bodies.rectangle(734, 220, 28, 440, { isStatic: true, label: 'boundary' }),
        ...floaters
      ];
      body = Matter.Bodies.rectangle(startX, 112, 22, 38, { density: .002, friction: .55, frictionAir: .002, restitution: .02, label: 'lander' });
      Matter.Body.setVelocity(body, { x: startX < PAD_X ? .15 : -.15, y: .7 });
      Matter.Composite.add(engine.world, [...obstacles, pad, body]);
    }

    function clearInput() {
      input.rotate = 0;
      input.thrust = false;
      document.querySelectorAll('[data-control]').forEach((button) => button.classList.remove('is-held'));
    }

    function reset() {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      running = false;
      fuel = 100;
      hudAt = 0;
      activeMs = 0;
      physicsAccumulator = 0;
      clearInput();
      setupWorld();
      draw();
    }

    function normalizedAngle() { return Math.atan2(Math.sin(body.angle), Math.cos(body.angle)); }

    function drawTelemetry() {
      const velocity = Matter.Body.getVelocity(body);
      const altitude = Math.max(0, Math.round((GROUND_Y - body.position.y) / 10));
      context.fillStyle = '#071525b0';
      context.fillRect(10, 10, 150, 88);
      context.fillStyle = '#d8f5ff';
      context.font = '12px ui-monospace, monospace';
      context.textBaseline = 'top';
      const lines = [
        `고도     ${altitude} m`,
        `수직 속도 ${Math.max(0, velocity.y).toFixed(1)} m/s`,
        `수평 속도 ${Math.abs(velocity.x).toFixed(1)} m/s`,
        `기울기   ${Math.round(normalizedAngle() * 180 / Math.PI)}°`,
        `연료     ${Math.ceil(fuel)}%`
      ];
      lines.forEach((line, index) => context.fillText(line, 18, 17 + index * 16));
    }

    function draw() {
      const sky = context.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, '#071525');
      sky.addColorStop(.72, '#123b55');
      sky.addColorStop(1, '#24718a');
      context.fillStyle = sky;
      context.fillRect(0, 0, WIDTH, HEIGHT);
      stars.forEach((star) => {
        context.globalAlpha = star.alpha;
        context.fillStyle = '#d8f5ff';
        context.beginPath();
        context.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        context.fill();
      });
      context.globalAlpha = 1;
      context.fillStyle = '#a8d8e2';
      context.beginPath();
      context.arc(592, 102, 34, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = '#74b4c7';
      context.beginPath();
      context.arc(580, 94, 7, 0, Math.PI * 2);
      context.arc(606, 111, 10, 0, Math.PI * 2);
      context.arc(600, 87, 4, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = '#092136';
      context.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);
      context.strokeStyle = '#28758a';
      context.lineWidth = 2;
      for (let wave = 0; wave < 7; wave += 1) {
        const y = GROUND_Y + 13 + wave * 7;
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(WIDTH, y);
        context.stroke();
      }
      context.fillStyle = '#b9ced6';
      context.fillRect(0, GROUND_Y, PAD_X - PAD_WIDTH / 2, 5);
      context.fillRect(PAD_X + PAD_WIDTH / 2, GROUND_Y, WIDTH - PAD_X - PAD_WIDTH / 2, 5);
      context.fillStyle = '#ff765f';
      context.fillRect(PAD_X - PAD_WIDTH / 2, GROUND_Y - 10, PAD_WIDTH, 7);
      context.fillStyle = '#f2f6f5';
      for (let stripe = 0; stripe < 5; stripe += 1) context.fillRect(PAD_X - 50 + stripe * 25, GROUND_Y - 8, 10, 3);
      floaters.forEach((item) => {
        const { min, max } = item.bounds;
        context.fillStyle = '#5d7380';
        context.fillRect(min.x, min.y, max.x - min.x, max.y - min.y);
        context.fillStyle = '#ffb347';
        for (let x = min.x; x < max.x - 8; x += 16) context.fillRect(x, min.y, 8, 4);
        context.strokeStyle = '#a9c0cc';
        context.lineWidth = 1;
        context.strokeRect(min.x + .5, min.y + .5, max.x - min.x - 1, max.y - min.y - 1);
      });

      if (!body) return;
      context.save();
      context.translate(body.position.x, body.position.y);
      context.rotate(body.angle);
      if (running && input.thrust && fuel > 0) {
        const flameLength = 19 + Math.random() * 10;
        context.fillStyle = '#ff765f';
        context.beginPath();
        context.moveTo(-6, 17);
        context.lineTo(0, 17 + flameLength);
        context.lineTo(6, 17);
        context.closePath();
        context.fill();
        context.fillStyle = '#ffd27d';
        context.beginPath();
        context.moveTo(-3, 17);
        context.lineTo(0, 17 + flameLength * .68);
        context.lineTo(3, 17);
        context.fill();
      }
      context.fillStyle = '#f0f5f4';
      context.beginPath();
      context.moveTo(0, -24);
      context.lineTo(10, -8);
      context.lineTo(8, 15);
      context.lineTo(-8, 15);
      context.lineTo(-10, -8);
      context.closePath();
      context.fill();
      context.fillStyle = '#ff765f';
      context.beginPath();
      context.moveTo(0, -24);
      context.lineTo(6, -13);
      context.lineTo(-6, -13);
      context.closePath();
      context.fill();
      context.fillRect(-13, 8, 5, 10);
      context.fillRect(8, 8, 5, 10);
      context.fillStyle = '#80b9c0';
      context.beginPath();
      context.arc(0, -4, 4, 0, Math.PI * 2);
      context.fill();
      context.restore();
      drawTelemetry();
    }

    function finish(safe) {
      if (!running) return;
      running = false;
      frame = null;
      clearInput();
      const velocity = Matter.Body.getVelocity(body);
      const verticalSpeed = Math.max(0, velocity.y);
      const horizontalSpeed = Math.abs(velocity.x);
      const angle = Math.abs(normalizedAngle());
      const score = safe ? Math.max(100, Math.round(1200 - verticalSpeed * 120 - horizontalSpeed * 110 - angle * 220)) : 0;
      draw();
      Scorex.hud({ score, progress: fuel / 100, status: safe ? 'LANDED' : 'CRASH' });
      Scorex.gameOver({ score, durationMs: Math.max(1, Math.round(activeMs)), result: safe ? 'clear' : 'fail', meta: { vy: Number(verticalSpeed.toFixed(2)) } });
    }

    function onCollision(event) {
      if (!running) return;
      let touchedPad = false;
      let touchedHazard = false;
      event.pairs.forEach(({ bodyA, bodyB }) => {
        if (bodyA !== body && bodyB !== body) return;
        const other = bodyA === body ? bodyB : bodyA;
        if (other === pad) touchedPad = true;
        else if (obstacles.includes(other)) touchedHazard = true;
      });
      if (touchedPad) {
        const velocity = Matter.Body.getVelocity(body);
        const centered = Math.abs(body.position.x - PAD_X) <= PAD_WIDTH / 2 - 14;
        finish(centered && velocity.y >= -.2 && velocity.y <= 2.8 && Math.abs(velocity.x) <= 2.4 && Math.abs(normalizedAngle()) <= .22);
      } else if (touchedHazard) {
        finish(false);
      }
    }
    Matter.Events.on(engine, 'collisionStart', onCollision);

    function animate(now) {
      if (!running) { frame = null; return; }
      const elapsed = now - lastAt;
      lastAt = now;
      activeMs += elapsed;
      physicsAccumulator += Math.min(elapsed, 100);
      while (physicsAccumulator >= PHYSICS_STEP_MS && running) {
        if (input.rotate !== 0) Matter.Body.setAngle(body, body.angle + input.rotate * .018);
        if (input.thrust && fuel > 0) {
          const force = body.mass * .00017;
          Matter.Body.applyForce(body, body.position, { x: Math.sin(body.angle) * force, y: -Math.cos(body.angle) * force });
          fuel = Math.max(0, fuel - .18);
        }
        Matter.Engine.update(engine, PHYSICS_STEP_MS);
        physicsAccumulator -= PHYSICS_STEP_MS;
        if (body.position.y > HEIGHT + 30 || body.position.x < -5 || body.position.x > WIDTH + 5) finish(false);
      }
      if (!running) return;
      if (now - hudAt > 100) {
        Scorex.hud({ progress: fuel / 100, status: 'FLIGHT' });
        hudAt = now;
      }
      draw();
      if (running) frame = requestAnimationFrame(animate);
    }

    function setControl(control, pressed) {
      if (!running) return;
      if (control === 'left') input.rotate = pressed ? -1 : input.rotate === -1 ? 0 : input.rotate;
      if (control === 'right') input.rotate = pressed ? 1 : input.rotate === 1 ? 0 : input.rotate;
      if (control === 'thrust') input.thrust = pressed;
      document.querySelector(`[data-control="${control}"]`)?.classList.toggle('is-held', pressed);
    }

    document.querySelectorAll('[data-control]').forEach((button) => {
      const control = button.dataset.control;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        setControl(control, true);
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => button.addEventListener(name, () => setControl(control, false)));
    });
    const keys = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'thrust', w: 'thrust', W: 'thrust' };
    document.addEventListener('keydown', (event) => {
      if (!keys[event.key]) return;
      event.preventDefault();
      setControl(keys[event.key], true);
    });
    document.addEventListener('keyup', (event) => { if (keys[event.key]) setControl(keys[event.key], false); });
    window.addEventListener('blur', clearInput);

    Scorex.onInit((init) => {
      rng = seeded(init.seed);
      stars = Array.from({ length: 70 }, () => ({ x: rng() * WIDTH, y: rng() * 320, size: .5 + rng() * 1.5, alpha: .25 + rng() * .65 }));
      reset();
    });
    Scorex.onStart(() => {
      reset();
      running = true;
      lastAt = performance.now();
      frame = requestAnimationFrame(animate);
      Scorex.started();
      Scorex.hud({ score: 0, progress: 1, status: 'FLIGHT' });
    });
    Scorex.onPause(() => { if (frame !== null) cancelAnimationFrame(frame); frame = null; physicsAccumulator = 0; clearInput(); });
    Scorex.onResume(() => { if (running && frame === null) { lastAt = performance.now(); physicsAccumulator = 0; frame = requestAnimationFrame(animate); } });
    Scorex.onDestroy(() => { running = false; if (frame !== null) cancelAnimationFrame(frame); });
    Scorex.connect({ gameId: 'rocket', gameVersion: '1.0.0' });
  </script>
</body>
</html>
