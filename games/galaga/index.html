<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>궤도 방어 전술</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071525; color: #d8f5ff; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    canvas { display: block; flex: 0 1 auto; width: auto; height: calc(100% - 38px); min-height: 0; max-width: 100%; aspect-ratio: 5 / 6; }
    .keyboard-hint { flex: 0 0 30px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 8px; color: #a9c1d3; font-size: 12px; white-space: nowrap; }
    kbd { padding: 2px 6px; border: 1px solid #31506a; border-radius: 4px; background: #102840; color: #e4f5ff; font: inherit; }
    .controls { display: none; flex: 0 0 72px; box-sizing: border-box; width: 100%; align-items: center; justify-content: space-between; padding: 8px 16px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .controls button { width: 58px; height: 54px; border: 1px solid #315d7b; border-radius: 12px; background: #102840; color: #c5f5ff; font-size: 25px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .controls button:active { background: #235371; }
    @media (pointer: coarse) {
      canvas { flex: 1 1 auto; width: auto; height: calc(100% - 80px); min-height: 0; }
      .controls { display: flex; }
      .keyboard-hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="480" height="576" aria-label="궤도 방어 전술 게임 화면"></canvas>
  <div class="keyboard-hint"><span><kbd>←</kbd> / <kbd>A</kbd> 왼쪽</span><span><kbd>→</kbd> / <kbd>D</kbd> 오른쪽</span></div>
  <div class="controls" aria-label="우주선 좌우 조작">
    <button type="button" data-control="left" aria-label="왼쪽">◀</button>
    <button type="button" data-control="right" aria-label="오른쪽">▶</button>
  </div>
  <script src="../../sdk/scorex-sdk.js"></script>
  <script src="game.js"></script>
</body>
</html>
