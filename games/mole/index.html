<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비상 경고등 진압</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10232f; }
    body { display: grid; place-items: center; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(92%, 620px); padding: 14px; box-sizing: border-box; background: radial-gradient(ellipse at center, #1b393b, #10232f 80%); }
    .hole { aspect-ratio: 1.35; position: relative; border: 1px solid #613448; border-radius: 9px; background: linear-gradient(145deg, #241b2b, #101a28); box-shadow: inset 0 0 14px #0008; cursor: pointer; touch-action: manipulation; padding: 0; }
    .hole:disabled { cursor: default; }
    .hole span { display: grid; place-items: center; height: 100%; color: #ff536f; font: bold clamp(24px, 6vw, 40px) ui-monospace, monospace; text-shadow: 0 0 8px #ff315c, 0 0 24px #ff315c; opacity: 0; transition: opacity 100ms ease; }
    .hole.active { border-color: #ff536f; background: #491d32; box-shadow: inset 0 0 16px #ff315c38, 0 0 16px #ff315c48; }
    .hole.active span { opacity: 1; }
    .hole:not(:disabled):active { transform: scale(.96); }
  </style>
</head>
<body>
  <div id="grid" aria-label="선내 비상 경고 스위치"></div>
  <script src="../../sdk/scorex-sdk.js"></script>
  <script src="game.js"></script>
</body>
</html>
