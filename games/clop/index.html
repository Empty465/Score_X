<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4족 보행 로봇 운영</title>
  <style>
    html, body { margin: 0; height: 100%; background: #091626; color: #dce9f8; font: 12px system-ui, sans-serif; overflow: hidden; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto; }
    #canvas { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #091626; }
    .bar { padding: 6px 14px 8px; border-top: 1px solid #314a65; background: #0b1a2c; color: #91a5bf; font: 10px ui-monospace, monospace; }
    .bar .labels { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .bar strong { color: #8ff5e5; font-size: 11px; }
    .track { position: relative; height: 6px; margin: 0 10px; border-radius: 4px; background: #263a52; }
    .fill { height: 100%; width: 0; border-radius: 4px; background: #65e6d1; }
    .marker { position: absolute; top: -9px; left: 0; width: 24px; height: 24px; margin-left: -12px; display: grid; place-items: center; font-size: 16px; line-height: 1; }
    .tilt { padding: 4px 14px 6px; background: #0b1a2c; color: #91a5bf; font-size: 10px; }
    .tilt div { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .tilt strong { color: #dce9f8; font: 10px ui-monospace, monospace; }
    progress { display: block; width: 100%; height: 6px; appearance: none; border: 0; border-radius: 4px; overflow: hidden; background: #263a52; }
    progress::-webkit-progress-bar { background: #263a52; }
    progress::-webkit-progress-value { background: #65e6d1; transition: width 80ms linear; }
    .tilt.danger progress::-webkit-progress-value { background: #ff718b; }
    .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px 8px; background: #0b1a2c; }
    .controls button { height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #314a65; border-radius: 4px; background: #14253a; color: #b9d0e7; font: 16px system-ui, sans-serif; cursor: pointer; touch-action: none; user-select: none; }
    .controls button small { font-size: 9px; }
    .controls button.is-held { border-color: #65e6d1; background: #163b45; color: #a6fff0; }
  </style>
</head>
<body>
  <canvas id="canvas" width="720" height="420" aria-label="4족 보행 로버 시험 시뮬레이션"></canvas>
  <div class="bar">
    <div class="labels"><span>🏁 출발 0m</span><strong id="now">현재 0m</strong><span>도착 120m 🚩</span></div>
    <div class="track"><div class="fill" id="fill"></div><div class="marker" id="marker">🤖</div></div>
  </div>
  <div class="tilt" id="tilt"><div><span>기울기</span><strong id="tilt-label">수평</strong></div><progress id="tilt-meter" max="100" value="0">0</progress></div>
  <div class="controls">
    <button type="button" data-key="q">Q<small>앞왼다리</small></button>
    <button type="button" data-key="w">W<small>앞오른다리</small></button>
    <button type="button" data-key="o">O<small>뒤왼다리</small></button>
    <button type="button" data-key="p">P<small>뒤오른다리</small></button>
  </div>
  <script src="../../sdk/scorex-sdk.js"></script>
  <script src="game.js"></script>
</body>
</html>
