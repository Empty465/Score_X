<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>궤도 진입 좌표 해독</title>
  <style>
    html, body { margin: 0; height: 100%; background: #071711; color: #87c99b; font: 12px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; background: linear-gradient(160deg, #0b211b, #071711); box-sizing: border-box; padding: 14px 16px 10px; }
    .prompt { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; }
    .icon { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid #327c53; border-radius: 5px; background: #102c1d; color: #7cff9c; font: 15px ui-monospace, monospace; }
    .prompt strong { color: #a7ffc0; font-size: 14px; }
    .prompt p { margin: 3px 0 0; color: #66a77d; font-size: 11px; }
    label { display: flex; justify-content: space-between; margin-bottom: 6px; }
    label span { font-size: 10px; }
    .row { display: flex; gap: 7px; }
    input { min-width: 0; width: 100%; height: 38px; border: 1px solid #34744e; border-radius: 3px; padding: 0 11px; background: #06140e; color: #8effa8; font: 16px ui-monospace, monospace; letter-spacing: 3px; box-sizing: border-box; }
    input:focus { border-color: #7cff9c; outline: 2px solid #65ff8d30; }
    input::placeholder { color: #3c7651; letter-spacing: 1px; }
    button { flex: 0 0 auto; min-height: 38px; padding: 0 14px; border: 0; border-radius: 4px; background: #69e68b; color: #062012; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled, input:disabled { opacity: .45; cursor: default; }
    #message { min-height: 16px; margin: 7px 0 0; color: #7fc795; font-size: 11px; }
    .heading { display: flex; justify-content: space-between; margin-top: 8px; padding: 8px 0 6px; border-top: 1px solid #17432e; color: #75b98b; }
    #log { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 0; list-style: none; }
    #log li { min-height: 30px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #17432e; color: #75b98b; }
    #log .empty { justify-content: center; }
    .num { font: 10px ui-monospace, monospace; }
    #log li strong { color: #b4ffc6; font: 13px ui-monospace, monospace; letter-spacing: 2px; }
    .result { margin-left: auto; color: #83ff9d; font-size: 10px; }
  </style>
</head>
<body>
  <div class="prompt"><span class="icon">&gt;_</span><div><strong>암호화된 진입 코드를 해독하세요.</strong><p>입력한 숫자와 위치를 분석해 좌표 신호로 응답합니다.</p></div></div>
  <div id="form">
    <label for="input">보안 코드 입력 <span>1~9 중 중복 없는 숫자 3개</span></label>
    <div class="row"><input id="input" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="예: 427" disabled><button type="button" id="send" disabled>코드 전송 ↗</button></div>
    <p id="message" aria-live="polite">시작하려면 사이드 패널의 '새 보안 코드 발급' 버튼을 누르세요.</p>
  </div>
  <div class="heading"><span>터미널 분석 기록 · 최근 시도 순</span><span><b id="attempts">0</b> / 9회</span></div>
  <ol id="log" aria-live="polite"><li class="empty">터미널 응답 대기 중</li></ol>
  <script src="../../sdk/scorex-sdk.js"></script>
  <script>
    const MAX_ATTEMPTS = 9;
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const message = document.querySelector('#message');
    const log = document.querySelector('#log');
    let rng = Math.random;
    let answer = '';
    let attempts = 0;
    let running = false;
    let paused = false;
    let activeMs = 0;
    let resumedAt = 0;

    function seeded(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function elapsedMs() { return activeMs + (running && !paused ? Date.now() - resumedAt : 0); }

    function setEnabled(on) { input.disabled = !on; send.disabled = !on; if (on) input.focus(); }

    function newCode() {
      const digits = [...'123456789'];
      for (let i = digits.length - 1; i > 0; i -= 1) {
        const j = Math.floor(rng() * (i + 1));
        [digits[i], digits[j]] = [digits[j], digits[i]];
      }
      answer = digits.slice(0, 3).join('');
    }

    function finish(won) {
      activeMs = elapsedMs();
      running = false;
      setEnabled(false);
      Scorex.hud({ lives: MAX_ATTEMPTS - attempts, status: won ? 'WIN' : 'GAME OVER' });
      Scorex.gameOver({
        score: won ? (10 - attempts) * 100 : 0,
        durationMs: Math.max(1, Math.round(activeMs)),
        result: won ? 'clear' : 'fail',
        meta: { attempts }
      });
    }

    function submitGuess() {
      if (!running || paused) return;
      const guess = input.value.trim();
      if (!/^[1-9]{3}$/.test(guess) || new Set(guess).size !== 3) {
        message.textContent = '1~9 중 서로 다른 숫자 3개를 입력해야 합니다.';
        input.focus();
        return;
      }
      attempts += 1;
      let position = 0;
      let signal = 0;
      [...guess].forEach((digit, index) => {
        if (digit === answer[index]) position += 1;
        else if (answer.includes(digit)) signal += 1;
      });
      if (attempts === 1) log.replaceChildren();
      const row = document.createElement('li');
      const number = Object.assign(document.createElement('span'), { className: 'num', textContent: String(attempts).padStart(2, '0') });
      const code = document.createElement('strong');
      code.textContent = guess;
      const result = Object.assign(document.createElement('span'), {
        className: 'result',
        textContent: [position ? `좌표 일치 ${position}` : '', signal ? `신호 검출 ${signal}` : ''].filter(Boolean).join(' · ') || '미검출 · 일치 좌표 없음'
      });
      row.append(number, code, result);
      log.prepend(row);
      input.value = '';
      document.querySelector('#attempts').textContent = String(attempts);
      Scorex.hud({ lives: MAX_ATTEMPTS - attempts, status: 'PLAYING' });
      if (position === 3) {
        message.textContent = `${attempts}회 만에 좌표 코드를 해독했습니다.`;
        finish(true);
      } else if (attempts === MAX_ATTEMPTS) {
        message.textContent = `해독 실패 · 보안 코드 ${answer}를 확보하지 못했습니다.`;
        finish(false);
      } else {
        message.textContent = position || signal ? `터미널 응답 · 좌표 일치 ${position} · 신호 검출 ${signal}` : '터미널 응답 · 코드와 일치하는 좌표 신호가 없습니다.';
        input.focus();
      }
    }

    send.addEventListener('click', submitGuess);
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter') submitGuess(); });

    Scorex.onInit((init) => {
      rng = seeded(init.seed);
      newCode();
      attempts = 0; activeMs = 0; running = false; paused = false;
      input.value = '';
      document.querySelector('#attempts').textContent = '0';
      log.replaceChildren(Object.assign(document.createElement('li'), { className: 'empty', textContent: '터미널 응답 대기 중 · 첫 코드를 입력하세요.' }));
      message.textContent = '1~9 중 서로 다른 숫자 3개로 보안 코드를 입력하세요.';
    });
    Scorex.onStart(() => {
      running = true; paused = false; resumedAt = Date.now();
      setEnabled(true);
      Scorex.started();
      Scorex.hud({ lives: MAX_ATTEMPTS, status: 'PLAYING' });
    });
    Scorex.onPause(() => { if (!running) return; activeMs += Date.now() - resumedAt; paused = true; setEnabled(false); });
    Scorex.onResume(() => { if (!running) return; paused = false; resumedAt = Date.now(); setEnabled(true); });
    Scorex.onDestroy(() => { running = false; });
    Scorex.connect({ gameId: 'baseball', gameVersion: '1.0.0' });
  </script>
</body>
</html>
