<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>궤도 진입 좌표 해독</title>
  <style>
    html, body { margin: 0; height: 100%; background: #071711; color: #87c99b; font: 12px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; background: linear-gradient(160deg, #0b211b, #071711); box-sizing: border-box; padding: 14px 16px 10px; }
    .prompt { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; }
    .icon { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid #327c53; border-radius: 5px; background: #102c1d; color: #7cff9c; font: 15px ui-monospace, monospace; }
    .prompt strong { color: #a7ffc0; font-size: 14px; }
    .prompt p { margin: 3px 0 0; color: #66a77d; font-size: 11px; }
    label { display: flex; justify-content: space-between; margin-bottom: 6px; }
    label span { font-size: 10px; }
    .row { display: flex; gap: 7px; }
    input { min-width: 0; width: 100%; height: 38px; border: 1px solid #34744e; border-radius: 3px; padding: 0 11px; background: #06140e; color: #8effa8; font: 16px ui-monospace, monospace; letter-spacing: 3px; box-sizing: border-box; }
    input:focus { border-color: #7cff9c; outline: 2px solid #65ff8d30; }
    input::placeholder { color: #3c7651; letter-spacing: 1px; }
    button { flex: 0 0 auto; min-height: 38px; padding: 0 14px; border: 0; border-radius: 4px; background: #69e68b; color: #062012; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled, input:disabled { opacity: .45; cursor: default; }
    #message { min-height: 16px; margin: 7px 0 0; color: #7fc795; font-size: 11px; }
    .heading { display: flex; justify-content: space-between; margin-top: 8px; padding: 8px 0 6px; border-top: 1px solid #17432e; color: #75b98b; }
    #log { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 0; list-style: none; }
    #log li { min-height: 30px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #17432e; color: #75b98b; }
    #log .empty { justify-content: center; }
    .num { font: 10px ui-monospace, monospace; }
    #log li strong { color: #b4ffc6; font: 13px ui-monospace, monospace; letter-spacing: 2px; }
    .result { margin-left: auto; color: #83ff9d; font-size: 10px; }
  </style>
</head>
<body>
  <div class="prompt"><span class="icon">&gt;_</span><div><strong>암호화된 진입 코드를 해독하세요.</strong><p>입력한 숫자와 위치를 분석해 좌표 신호로 응답합니다.</p></div></div>
  <div id="form">
    <label for="input">보안 코드 입력 <span>1~9 중 중복 없는 숫자 3개</span></label>
    <div class="row"><input id="input" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="예: 427" disabled><button type="button" id="send" disabled>코드 전송 ↗</button></div>
    <p id="message" aria-live="polite">시작하려면 사이드 패널의 '새 보안 코드 발급' 버튼을 누르세요.</p>
  </div>
  <div class="heading"><span>터미널 분석 기록 · 최근 시도 순</span><span><b id="attempts">0</b> / 9회</span></div>
  <ol id="log" aria-live="polite"><li class="empty">터미널 응답 대기 중</li></ol>
  <script src="../../sdk/scorex-sdk.js"></script>
  <script src="game.js"></script>
</body>
</html>
